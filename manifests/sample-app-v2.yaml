apiVersion: v1
kind: Namespace
metadata:
  name: demo2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: demo2
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: api-svc
  namespace: demo2
spec:
  selector: {app: api}
  ports: [{port: 99999, targetPort: 80}]   # erro proposital: porta > 65535
